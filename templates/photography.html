{% extends "layout.html" %}

{% block title %}Photos | {{ super() }}{% endblock %}

{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='styles/gallery.css') }}">{% endblock %}

{% block content %}
    {% block header %}Photography{% endblock %}
    <div class="row">
        <div class="column">
            <img src="{{ url_for('static', filename='img/photos/bark.jpeg') }}" alt="bark" loading="lazy" class="photo">
            <img src="{{ url_for('static', filename='img/photos/beach.jpeg') }}" alt="beach" loading="lazy" class="photo">
            <img src="{{ url_for('static', filename='img/photos/park.jpeg') }}" alt="park" loading="lazy" class="photo">
        </div>
        <div class="column">
            <img src="{{ url_for('static', filename='img/photos/canoe.jpeg') }}" alt="canoe" loading="lazy" class="photo">
            <img src="{{ url_for('static', filename='img/photos/flower.jpeg') }}" alt="flower" loading="lazy" class="photo">
        </div>
        <div class="column">
            <img src="{{ url_for('static', filename='img/photos/lighthouse.jpeg') }}" alt="lighthouse" loading="lazy" class="photo">
            <img src="{{ url_for('static', filename='img/photos/nyc.jpeg') }}" alt="nyc" loading="lazy" class="photo">
            <img src="{{ url_for('static', filename='img/photos/path.jpeg') }}" alt="path" loading="lazy" class="photo">
        </div>
        <div class="column">
            
        </div>
    </div>
{% endblock %}
