<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost?</title>

    <!-- Your Tailwind build -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/output.css') }}"
    />

    <!-- Your fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="h-full bg-bg dark:bg-d-bg text-text dark:text-d-text font-sans">
    <div class="min-h-screen grid lg:grid-cols-2">
      <div
        class="flex flex-col justify-around px-6 py-12 max-w-5xl mx-auto w-full"
      >
        <div class="max-w-md">
          <p class="text-sm text-muted mb-4">404</p>
          <h1
            class="font-display text-6xl md:text-8xl leading-[0.95] tracking-tight mb-6"
          >
            Lost?
          </h1>
          <div class="w-8 h-[2px] bg-muted mb-6"></div>
          <p class="text-muted mb-8">
            We couldn’t find the page you’re looking for.
          </p>
          <a href="/" class="text-sm text-muted hover:text-text transition">
            ← Back to home
          </a>
        </div>
      </div>
      <div class="hidden lg:block relative">
        <img
          src="{{ url_for('static', filename='img/photos/path.jpeg') }}"
          alt=""
          class="absolute inset-0 w-full h-full object-cover"
        />
      </div>
    </div>
  </body>
</html>
