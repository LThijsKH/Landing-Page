<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta lang="en">
    <title>{% block title %}Leo Keeren-Hall{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/output.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Kapakana:wght@300..400&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-bg dark:bg-d-bg text-text dark:text-d-text selection:bg-accent">
    <nav class="min-w-full sticky top-0 z-50 border-b dark:border-d-line border-line print:hidden bg-bg dark:bg-d-bg">
        <div class="relative flex justify-center md:justify-between">
            <div class="mx-5 py-5 border-b-2 {{ 'border-accent' if active_page == 'home' else 'border-transparent hover:border-muted hover:darkborder-d-muted' }} -mb-px"><a href="{{ url_for('landing') }}">LTKH</a></div>
            <!-- TODO: setup switching views in phtoography template -->
            <div class="absolute top-0 w-1/10 left-[45vw] h-full justify-center align-middle {{ 'flex' if active_page == 'photography' else 'hidden' }}">
                <button onclick="showView(0)" class="cursor-pointer">
                    <svg class="w-6 h-6 m-auto text-text dark:text-d-text hover:text-muted dark:hover:text-d-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <rect x="3" y="6" width="18" height="14" rx="2"></rect>
                        <circle cx="12" cy="13" r="3"></circle>
                        <path d="M8 6l1.5-2h5L16 6"></path>
                    </svg>
                </button>
                <button onclick="showView(1)" class="cursor-pointer">
                    <svg class="w-6 h-6 m-auto text-text dark:text-d-text hover:text-muted dark:hover:text-d-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                </button>
                <button onclick="showView(2)" class="cursor-pointer">
                    <svg class="w-6 h-6 m-auto text-text dark:text-d-text hover:text-muted dark:hover:text-d-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path d="M4 9V4h5"></path>
                        <path d="M20 9V4h-5"></path>
                        <path d="M4 15v5h5"></path>
                        <path d="M20 15v5h-5"></path>
                    </svg>
                </button>
            </div>
            <div class="hidden md:flex px-2">
                <a class="mx-5 py-5 border-b-2 {{ 'border-accent' if active_page == 'photography' else 'border-transparent hover:border-muted hover:darkborder-d-muted' }} -mb-px" href="{{ url_for('photography') }}">Photography</a>
                <a class="mx-5 py-5 border-b-2 {{ 'border-accent' if active_page == 'projects' else 'border-transparent hover:border-muted hover:darkborder-d-muted' }}  -mb-px" href="{{ url_for('projects') }}">Projects</a>
                <a class="mx-5 py-5 border-b-2 border-transparent hover:border-muted -mb-px" href="#Contact">Contact</a>
            </div>
        </div>
    </nav>
    <div class="m-5 min-h-[calc(100vh-25rem)]">
        {% block content %}{% endblock %}
    </div>
    <footer class="min-w-full items-center justify-center md:justify-between border-t dark:border-d-line border-line print:hidden p-4 flex bg-bg dark:bg-d-bg">
        <div class="p-4 flex flex-col h- justify-between">
            <div class="self-center">
                <h3 id="Contact" class="font-bold">
                    Contact
                </h3>
                <div id="links" class="flex flex-col gap-1 hover:text-muted">
                    <a href="https://www.linkedin.com/in/leotkh" class="hover:text-text dark:hover:text-d-text" target="_blank" rel="noopener">
                        LinkedIn
                    </a>
                    <a href="mailto:lkeerenhall@gmail.com" class="hover:text-text dark:hover:text-d-text">
                        Email
                    </a>
                    <a href="https://github.com/lthijskh" class="hover:text-text dark:hover:text-d-text" target="_blank" rel="noopener">
                        GitHub
                    </a>
                    <iframe id="printFrame" src="index.html" style="display:none;"></iframe>
                    <a href="#" onclick="window.print()" class="hover:text-text dark:hover:text-d-text">
                        Print my resume
                    </a>
                </div>
            </div>
            <p class="text-muted font-extralight text-xs mt-auto">
            © 2026 Leo T. K-H
            </p>
        </div>
        <div class="p-4">
            <h2 class="-m-7 text-right font-display font-extrabold text-9xl tracking-tighter">
                Leo Thijs <br>
                Keeren-Hall
            </h2>
        </div>
    </footer>
</body>
</html>
